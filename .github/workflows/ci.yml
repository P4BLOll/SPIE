name: CI Pipeline - Validação e Tags

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Validar ficheiros JSON
        run: |
          jq empty app.json

      - name: Linting de Markdown (Documentação de Skills)
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: "**/*.md"

  deploy-firebase:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy para Firebase
        # O repositório contém o ficheiro .firebaserc na raiz
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}